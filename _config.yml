title: "US Layer"
name: "US Layer"
description: "Professional IT and security services in Galle, Sri Lanka — IP CCTV installation, burglar alarm systems, WiFi networking and software development."
url: "https://uslayer.com"
email: contact@uslayer.com
formspree: xqknzwyk
timezone: UTC
baseurl: ""
permalink: "/:title/"
logo: 'assets/images/uslayer-logo.svg'
favicon: 'assets/images/fav.svg'
author: "US Layer"
paginate: 30
disqus: 'us-layer'
locale: en_us
lang: en_us
feed_items: 10
feed_update_period: daily
feed_update_frequency: 1
markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    disable: true


ganalytics: G-SX2M6Q5WKD
fbpageid: uslayer


# Social
social:
#  instagram: https://www.instagram.com/uslayer/
  facebook: https://www.facebook.com/uslayer
  twitter: https://twitter.com/us_layer
  youtube: https://www.youtube.com/uslayer

# Twitter card (used by jekyll-seo-tag)
twitter:
  username: us_layer
  card: summary_large_image

# Default OG image for all pages/posts that don't define their own image
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/uslayer_cctv_ad.jpg

# Plugins
plugins:
- jekyll-paginate
- jekyll-sitemap
- jekyll-feed
- jekyll-seo-tag
- jekyll-archives

# jekyll-archives: auto-generate category + tag pages → picked up by jekyll-sitemap
jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: archive
    tag: archive
  permalinks:
    category: /category/:name/
    tag: /tag/:name/
