<header class="site-header" id="site-header">
  <div class="container">
    <nav class="navbar navbar-expand-lg" aria-label="Main navigation">

      <!-- Brand -->
      <a class="navbar-brand" href="/" aria-label="US LAYER home">
        <img src="/assets/images/uslayer_logo.svg" alt="US LAYER" height="32" loading="eager">
      </a>

      <!-- Mobile toggler -->
      <button class="navbar-toggler ms-auto" type="button"
              data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Nav links -->
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1 mb-2 mb-lg-0">
          {% for item in site.data.menus.topmenu %}
          <li class="nav-item">
            <a href="{{ item.url | relative_url }}"
               class="nav-link {% if page.url == item.url %}active{% endif %}">
              {{ item.title }}
            </a>
          </li>
          {% endfor %}

          <!-- Social icons (desktop) -->
          <li class="nav-item d-none d-lg-flex align-items-center ms-1">
            <div style="width:1px;height:20px;background:var(--c-border);margin:0 0.5rem;"></div>
          </li>
          {% if site.social.facebook %}
          <li class="nav-item d-none d-lg-block">
            <a class="nav-link px-2" href="{{ site.social.facebook }}" target="_blank" rel="noopener" aria-label="Facebook">
              <i class="bi bi-facebook"></i>
            </a>
          </li>
          {% endif %}

          <!-- Theme switcher -->
          <li class="nav-item dropdown d-none d-lg-block">
            <button class="nav-link dropdown-toggle px-2 border-0 bg-transparent"
                    id="themeToggle" type="button"
                    data-bs-toggle="dropdown" aria-expanded="false" aria-label="Toggle theme">
              <svg class="bi theme-icon-active" style="width:1em;height:1em;"><use href="#moon-stars-fill"></use></svg>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm" style="min-width:9rem;font-size:.85rem;border-radius:var(--r-md);">
              <li>
                <button class="dropdown-item d-flex align-items-center gap-2" type="button" data-bs-theme-value="light" aria-pressed="false">
                  <svg class="bi theme-icon opacity-60"><use href="#sun-fill"></use></svg> Light
                  <svg class="bi ms-auto d-none"><use href="#check2"></use></svg>
                </button>
              </li>
              <li>
                <button class="dropdown-item d-flex align-items-center gap-2 active" type="button" data-bs-theme-value="dark" aria-pressed="true">
                  <svg class="bi theme-icon opacity-60"><use href="#moon-stars-fill"></use></svg> Dark
                  <svg class="bi ms-auto d-none"><use href="#check2"></use></svg>
                </button>
              </li>
              <li>
                <button class="dropdown-item d-flex align-items-center gap-2" type="button" data-bs-theme-value="auto" aria-pressed="false">
                  <svg class="bi theme-icon opacity-60"><use href="#circle-half"></use></svg> Auto
                  <svg class="bi ms-auto d-none"><use href="#check2"></use></svg>
                </button>
              </li>
            </ul>
          </li>

          <!-- CTA button -->
          <li class="nav-item ms-lg-2">
            <a href="https://wa.me/94769026918" class="nav-cta" target="_blank" rel="noopener noreferrer">
              <i class="bi bi-whatsapp me-1"></i>WhatsApp Us
            </a>
          </li>
        </ul>
      </div>

    </nav>
  </div>
</header>

<script>
  // Sticky shadow on scroll
  window.addEventListener('scroll', function() {
    document.getElementById('site-header').classList.toggle('scrolled', window.scrollY > 10);
  }, { passive: true });
</script>
