---
layout: compress
---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="246QM4Xki0jvdh3ANoDKXe-UOPQ23He8W83KY4P5ttA" />
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0a2540">

<!-- Favicons -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ site.baseurl }}/assets/images/fav/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/assets/images/fav/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/assets/images/fav/favicon-16x16.png">
<link rel="manifest" href="{{ site.baseurl }}/assets/images/fav/site.webmanifest">
<link rel="mask-icon" href="{{ site.baseurl }}/assets/images/fav/safari-pinned-tab.svg" color="#0a2540">
<meta name="msapplication-TileColor" content="#0a2540">

{% seo %}

<!-- ── Structured Data ──────────────────────────────────────── -->

<!-- Organization -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "US Layer",
  "alternateName": "US Layer IT Solutions",
  "url": "{{ site.url }}",
  "logo": "{{ site.url }}/assets/images/uslayer-logo.svg",
  "sameAs": [
    "https://www.facebook.com/uslayer",
    "https://twitter.com/us_layer",
    "https://www.youtube.com/uslayer"
  ]
}
</script>

<!-- BlogPosting / Article -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.url | absolute_url }}"
  },
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: page.excerpt | strip_html | truncatewords: 50 | jsonify }},
  {% if page.image %}
  "image": {
    "@type": "ImageObject",
    "url": "{{ site.url }}/{{ page.image }}",
    "width": 1200,
    "height": 630
  },
  {% endif %}
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "author": {
    "@type": "Organization",
    "name": "{{ site.author }}",
    "url": "{{ site.url }}"
  },
  "publisher": {
    "@type": "Organization",
    "name": "US Layer",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ site.url }}/assets/images/uslayer-logo.svg"
    }
  },
  "keywords": {{ page.tags | join: ", " | jsonify }},
  "articleSection": {{ page.categories | first | jsonify }},
  "inLanguage": "en-US"
}
</script>

<!-- BreadcrumbList -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ site.url }}/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Blog",
      "item": "{{ site.url }}/blog/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.title | jsonify }},
      "item": "{{ page.url | absolute_url }}"
    }
  ]
}
</script>

<!-- Preconnect -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Theme switcher (before CSS to avoid FOUC) -->
<script src="{{ site.baseurl }}/assets/js/color-modes.js" data-cfasync="false"></script>

<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<!-- US LAYER Styles -->
<link href="{{ site.baseurl }}/assets/css/styles.css" rel="stylesheet">
<link href="{{ site.baseurl }}/assets/css/custom.css" rel="stylesheet">
<!-- Gallery -->
<link href="{{ site.baseurl }}/assets/css/gallery.css" rel="stylesheet">
<script src="{{ site.baseurl }}/assets/js/gallery.js" defer></script>

{% if jekyll.environment == "production" %}
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ganalytics }}"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', '{{ site.ganalytics }}');
</script>
<!-- Microsoft Clarity -->
<script>(function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i+"?ref=bwt";y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y)})(window,document,"clarity","script","ejdzgl0xtg");</script>
{% endif %}

</head>

{% capture layout %}{% if page.layout %}layout-{{ page.layout }}{% endif %}{% endcapture %}
<body class="{{ layout }}">

{% include them_selection_svg.html %}

{% include nav_new.html %}

<main id="main-content" class="container py-4">
  {{ content }}
</main>

{% include footer.html %}

</body>
</html>
